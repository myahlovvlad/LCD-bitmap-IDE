name: Tauri — Windows, Linux, macOS

on:
  push:
    branches: [main, master]
    paths:
      - "apps/tauri/**"
      - "src/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/tauri-build.yml"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tauri:
    name: Tauri / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact: tauri-windows
            bundles: nsis
            bundlePath: apps/tauri/src-tauri/target/release/bundle
          - platform: ubuntu-22.04
            artifact: tauri-linux
            bundles: deb,appimage
            bundlePath: apps/tauri/src-tauri/target/release/bundle
          - platform: macos-latest
            artifact: tauri-macos
            bundles: app,dmg
            bundlePath: apps/tauri/src-tauri/target/release/bundle

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libudev-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri -> target

      - name: Install shared frontend dependencies
        run: npm ci

      - name: Install isolated Tauri dependencies
        run: npm ci --prefix apps/tauri

      - name: Build Tauri application
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm run tauri:build -- --bundles ${{ matrix.bundles }}; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Tauri packaging attempt $attempt failed; retrying in 20 seconds…"
            sleep 20
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundlePath }}
          if-no-files-found: error
          retention-days: 30
